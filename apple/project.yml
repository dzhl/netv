name: neTV
options:
  bundleIdPrefix: com.netv
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  neTV-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: neTV
        CFBundleURLTypes:
          - CFBundleURLName: com.netv.ios
            CFBundleURLSchemes:
              - netv
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: neTV connects to your television server on the local network.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netv.ios
        PRODUCT_NAME: neTV
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
  neTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - Shared
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: neTV
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: neTV connects to your television server on the local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netv.tvos
        PRODUCT_NAME: neTV
        TARGETED_DEVICE_FAMILY: "3"
    scheme:
      testTargets: []
  neTV-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: neTV
        CFBundleURLTypes:
          - CFBundleURLName: com.netv.macos
            CFBundleURLSchemes:
              - netv
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: neTV connects to your television server on the local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netv.macos
        PRODUCT_NAME: neTV
    scheme:
      testTargets: []
